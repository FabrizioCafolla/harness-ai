# Skill catalog for the bundled `harness-ai` source: per-tool frontmatter for
# every skill under content/skills/, since a skill body here carries none of
# its own. `default:` holds the values merged into every entry that does not
# override them.

default:
  opencode:
    license: MIT
    metadata:
      author: Fabrizio Cafolla
      version: '1.0'
  claude:
    license: MIT
    metadata:
      author: Fabrizio Cafolla
      version: '1.0'
  # Minimal on purpose (name/description only, no license/metadata.author —
  # not part of the informal .agents/ convention). Per-entry `agents:` blocks
  # are optional: when absent, the `agents` profile falls back to the
  # claude/opencode block's name+description.
  agents:

skills:
  wikictl:
    category: tools
    subcategory: cli
    opencode:
      name: wikictl
      description: "File-based AI memory system: read/recall, create, edit and MCP access to the wikictl wiki, all in one skill. Use when the agent mentions 'memory', 'remember', 'wiki', 'wikictl', 'recall', 'what do I know about', needs to persist a decision/preference/lesson, needs to update an existing wiki entry, or has an MCP client connected to a running wikictl server."
    claude:
      name: wikictl
      description: "File-based AI memory system: read/recall, create, edit and MCP access to the wikictl wiki, all in one skill. Use when the agent mentions 'memory', 'remember', 'wiki', 'wikictl', 'recall', 'what do I know about', needs to persist a decision/preference/lesson, needs to update an existing wiki entry, or has an MCP client connected to a running wikictl server."

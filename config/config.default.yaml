# harness-ai workspace config — single source of truth for what gets
# installed and scaffolded. Copied to .harness-ai/config.yaml on first run
# (copy-once); edit that copy, not this template.
version: 1

# Tools to scaffold skills/agents/hooks for: claude, opencode
tools: [claude]

# Optional CLI/MCP binaries installed via uv (or npm, for openspec)
install:
  rtk: true
  headroom: true
  wikictl: false
  openspec: true
  # Arbitrary extra install commands, run as `bash -c "<command>"` during
  # `install` (skipped by `sync`). Commands must be self-idempotent — no
  # already-installed check is done for custom entries.
  # custom:
  #   speckit: "uv tool install speckit-cli"
  custom: {}

# harness.py behavior flags
scaffold:
  createFileMCP: true
  createFileHooks: true
  createFileSetting: true
  updateGitignore: true
  installDefaults: true

# Behavioral defaults injected into AGENTS.md at scaffold time (not binary
# installs — these steer the model's behavior from the first message of a session)
behavior:
  caveman: true

# Named content repos merged on top of bundled defaults, in order (later
# wins on key collision). Each entry needs a unique `name` (not "default" or
# "local" — those are reserved for the bundled and workspace-local sources).
# The old singular `contentRepo: {url, ref}` key still works as sugar for a
# one-entry list (name derived from the URL), with a deprecation warning.
contentRepos: []
# - name: my-private-content
#   url: https://github.com/my-org/ai-content
#   ref: main

# Single skills pulled from a path inside someone else's repo. Point `url` at
# the directory on GitHub and the ref and sub-path are read straight out of it;
# a path holding SKILL.md is one skill, otherwise every sub-directory holding
# one is taken. Merged below the bundled defaults and above `contentRepos`, so
# a repo you curate always outranks a skill you pulled from elsewhere.
# `name` (rename), `ref` (override the URL's) and `path` (for a remote whose
# URL has no /tree/ part) are all optional.
skillPaths: []
# - url: https://github.com/mattpocock/skills/tree/main/skills/productivity/grill-me

# Skill-only include/exclude filtering (by category, category.subcategory, or
# explicit key). Agents are never filtered this way. Empty include means
# "install everything" (today's default behavior).
skills:
  include:
    categories: []
    keys: []
  exclude:
    categories: []
    keys: []

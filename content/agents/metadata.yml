default:
  opencode:
  claude:
  # Minimal on purpose (name/description only, no license/metadata.author) —
  # per-entry `agents:` blocks are optional: when absent, the `agents`
  # profile falls back to the claude/opencode block's name+description
  # (see harness.py's `_tool_meta_for`). See design.md D4.
  agents:

agents:
  developer:
    opencode:
      name: Developer
      description: >-
        This custom agent is responsible for implementing code changes based on
        user requirements. It follows a structured workflow to ensure
        high-quality code that meets specifications and passes all tests before
        completion.
      mode: subagent
    claude:
      name: Developer
      description: >-
        This custom agent is responsible for implementing code changes based on
        user requirements. It follows a structured workflow to ensure
        high-quality code that meets specifications and passes all tests before
        completion.
      allowedTools:
        - Read
        - Edit
        - Bash

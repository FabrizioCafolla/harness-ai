# Agent catalog for the bundled `harness-ai` source: per-tool frontmatter for
# every agent file under content/agents/, which carry no frontmatter of their own.

default:
  opencode:
  claude:
  # Minimal on purpose (name/description only, no license/metadata.author) —
  # per-entry `agents:` blocks are optional: when absent, the `agents`
  # profile falls back to the claude/opencode block's name+description
  # (see harness.py's `_tool_meta_for`).
  agents:

agents: {}

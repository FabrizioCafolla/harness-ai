# legacy-content-repo fixture: the OLD singular `contentRepo` key still works
# as sugar for a one-entry `contentRepos` list (name derived from the URL),
# with a deprecation warning. Points at GitHub's own long-lived demo repo
# purely because it's guaranteed to exist and clone, and its derived name
# ("hello-world") doesn't collide with a reserved source name; its content
# doesn't follow the content-repo layout, which is irrelevant to what this
# fixture checks (install succeeds + the warning fires + bundled content
# still works).
contentRepo:
  url: https://github.com/octocat/Hello-World.git
  ref: master

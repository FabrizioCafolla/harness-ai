# Command catalog. The key is the command's path without `.md` and carries its
# namespace, exactly as the tool addresses it: `dev/deep-task-analysis` lives at
# commands/dev/deep-task-analysis.md and is invoked as `/dev:deep-task-analysis`.
#
# Precedence is the same as skills and agents: default -> contentRepos ->
# workspace -> local, later sources winning on an identical key.
default:
  claude:
    metadata:
      author: Fabrizio Cafolla
      version: '1.0'
  # Minimal on purpose, mirroring skills/agents: when an entry has no explicit
  # `agents:` block the profile falls back to the claude block's name+description.
  agents:

commands:

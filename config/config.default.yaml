# harness-ai workspace config — single source of truth for what gets
# installed and scaffolded. Copied to .harness-ai/config.yaml on first run
# (copy-once); edit that copy, not this template.
version: 1

# Tools to scaffold skills/agents/hooks for: claude, opencode
tools: [claude]

# Optional CLI/MCP binaries installed via uv (or npm, for openspec)
install:
  rtk: true
  headroom: true
  wikictl: false
  openspec: true
  # Arbitrary extra install commands, run as `bash -c "<command>"` during
  # `install` (skipped by `sync`). Commands must be self-idempotent — no
  # already-installed check is done for custom entries.
  # custom:
  #   speckit: "uv tool install speckit-cli"
  custom: {}

# harness.py scaffold flags
scaffold:
  createFileMCP: true
  createFileHooks: true
  createFileSetting: true
  updateGitignore: true
  installDefaults: true

# Named content repos merged on top of the bundled `harness-ai` source, in
# order (later wins on key collision). Each entry needs a unique `name` (not
# "harness-ai", "workspace" or "local" — those are reserved for the bundled,
# auto-detected workspace-local, and hand-authored sources). The old singular
# `contentRepo: {url, ref}` key still works as sugar for a one-entry list
# (name derived from the URL), with a deprecation warning. A content repo can
# ship its own config.yaml (install commands + skillPaths/agentPaths/
# commandPaths) — see AGENTS.md's "Content Repo Format".
contentRepos: []
# - name: my-private-content
#   url: https://github.com/my-org/ai-content
#   ref: main

# A single skill, agent or command pulled from a path inside someone else's
# repo. Point `url` at the directory (skillPaths) or file (agentPaths/
# commandPaths) on GitHub and the ref and sub-path are read straight out of
# it; for skillPaths, a path holding SKILL.md is one skill, otherwise every
# sub-directory holding one is taken. Merged below the bundled `harness-ai`
# source and above `contentRepos`, so a repo you curate always outranks
# something pulled from elsewhere. `name` (rename), `ref` (override the
# URL's) and `path` (for a remote whose URL has no /tree/ part) are all
# optional.
skillPaths: []
# - url: https://github.com/mattpocock/skills/tree/main/skills/productivity/grill-me
agentPaths: []
# - url: https://github.com/my-org/ai-content/blob/main/agents/reviewer.md
commandPaths: []
# - url: https://github.com/my-org/ai-content/blob/main/commands/deploy/rollback.md

# Skill-only include/exclude filtering (by category, category.subcategory, or
# explicit key). Agents are never filtered this way. Empty include means
# "install everything" (today's default behavior).
skills:
  include:
    categories: []
    keys: []
  exclude:
    categories: []
    keys: []

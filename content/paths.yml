# Where each tool profile expects its assets, and what harness-ai renders for it.
# One block per profile: `base_dir` plus the skills/agents/commands sub-paths, with
# optional hooks and extra files. A profile that omits a kind simply never receives it.

opencode:
  base_dir: .opencode
  agents:
    dir: agents
    suffix: .md
  skills:
    dir: skills
    filename: SKILL.md
  hooks:
    source: config/opencode/rtk-plugin.ts
    dest: .opencode/plugins/rtk.ts

agents:
  base_dir: .agents
  agents:
    dir: agents
    suffix: .md
  skills:
    dir: skills
    filename: SKILL.md
  commands:
    dir: commands
    suffix: .md

claude:
  base_dir: .claude
  agents:
    dir: agents
    suffix: .md
  skills:
    dir: skills
    filename: SKILL.md
  # Command keys keep their namespace directories: `deploy/rollback` renders to
  # .claude/commands/deploy/rollback.md and is invoked as `/deploy:rollback`.
  commands:
    dir: commands
    suffix: .md
  extra_files:
    settings:
      - source: config/claude/settings.json
        dest: .claude/settings.json
        ignore: false
      - source: config/claude/settings.local.json
        dest: .claude/settings.local.json
        ignore: true
      - source: config/claude/statusline.sh
        dest: .claude/statusline.sh
        ignore: false
  hooks:
    source: config/claude/hooks.json
